/*---------------------------------------------------------------------------*\
Description
    Commercially pure aluminium, constant properties from
        A. Farzadi, S. Serajzadeh, A.H. Kokabi, Int J Adv Manuf Technol
        38 (2008) 258-267, Table 1 (after Hatch, 1984).

    Format follows $ADDITIVEFOAM_ETC/materials/*.cfg:
        kappa, Cp   Polynomial<3> coefficients (a0 a1 a2) -> a0 + a1*T + a2*T^2
        thermoPath  (T alpha.solid) pairs; linear solid fraction between
                    solidus 916 K and liquidus 930 K (Farzadi Eq. 4).

    DAS is not a measured dendrite arm spacing here: it is chosen so that
    AdditiveFOAM's Darcy term nu*180/DAS^2 reproduces the Carman-Kozeny
    constant A_mush = 1e8 kg/m3/s:  DAS = sqrt(180*mu/A_mush) = 50.2 um.
    scripts/make_cases.py overwrites DAS from config/baseline.json.

    emissivity is a placeholder (pending); dSigmadT is Farzadi's value
    (Pariona 2018 uses -3.5e-4 N/m/K for Al-1.5Fe).
\*---------------------------------------------------------------------------*/

solid
{
    kappa   (222.0  0.0  0.0);
    Cp      (904.0  0.0  0.0);
}

liquid
{
    kappa   (108.0  0.0  0.0);
    Cp      (904.0  0.0  0.0);
}

// No powder in a remelting case; kept because the solver requires the entry
powder
{
    kappa   (222.0  0.0  0.0);
    Cp      (904.0  0.0  0.0);
}

rho     [1 -3 0 0 0 0 0]    2700.0;
mu      [1 -1 -1 0 0 0 0]   0.0014;
beta    [0 0 0 -1 0 0 0]    2.55e-5;
DAS     [0 1 0 0 0 0 0]     5.02e-05;
Lf      [0 2 -2 0 0 0 0]    3.95e5;

emissivity  0.1;
dSigmadT    -0.152e-3;

thermoPath
(
    (916 1)
    (930 0)
);

// ************************************************************************* //
