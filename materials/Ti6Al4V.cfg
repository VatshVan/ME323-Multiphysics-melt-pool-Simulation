/*---------------------------------------------------------------------------*\
Description
    Ti-6Al-4V. Every value is taken from an open-access source; see
    materials/Ti6Al4V_sources.md for the full references and how each number
    was read or fitted.
        [G18] Ghosh et al., arXiv:1809.01056 (2018), Tables 1, 3, 4
              (after Boivineau et al. 2006 and the ASM Titanium handbook)
        [Y22] Yan, Zhu, Zhao, arXiv:2206.04799 (2022), Table 3
        [M24] Much et al., arXiv:2401.12114 (2024), Table 1
              (after Mohr et al. 2020 and Boivineau et al. 2006)
        [S25] Mater. Sci. Addit. Manuf. 4(1) (2025), doi:10.36922/msam.8332,
              Table 1
        [J20] Jelinek et al., arXiv:2007.01433 (2020), Table 1
    Format follows $ADDITIVEFOAM_ETC/materials/*.cfg:
        kappa, Cp   Polynomial<3> coefficients (a0 a1 a2) -> a0 + a1*T + a2*T^2
                    solid evaluated on [300 K, solidus], liquid on
                    [liquidus, 2*liquidus]; mixed by solid fraction.
    rho is constant in AdditiveFOAM (Boussinesq); the solid value is used
    because conduction in the solid dominates the domain (liquid: 4087 [M24]).
    thermoPath: endpoints only. scripts/make_cases.py replaces it with the
    cosine-smoothed solid fraction and overwrites DAS from config/baseline.json.
\*---------------------------------------------------------------------------*/

solid
{
    kappa   (3.3201  0.012937  0.0);    // [G18] Table 1, linear fit 373-1773 K
    Cp      (427.91  0.39895   0.0);    // [G18] Table 3, linear fit 293-1673 K
}

liquid
{
    kappa   (-6.7374  0.018117  0.0);   // [G18] Table 1, linear fit 1938-2699 K
    Cp      (1130.0  0.0  0.0);         // [M24] (Boivineau 2006)
}

// No powder in a remelting case; kept because the solver requires the entry
powder
{
    kappa   (3.3201  0.012937  0.0);
    Cp      (427.91  0.39895   0.0);
}

rho     [1 -3 0 0 0 0 0]    4428.0;     // [G18] Table 4
mu      [1 -1 -1 0 0 0 0]   3.5e-3;     // [M24] (Mohr 2020, ISS levitation)
beta    [0 0 0 -1 0 0 0]    1.6e-4;     // [S25]
DAS     [0 1 0 0 0 0 0]     8.37e-05;   // overwritten by make_cases.py
Lf      [0 2 -2 0 0 0 0]    2.9e5;      // [Y22] ([S25]: 2.92e5)

emissivity  0.54;                       // [J20]
dSigmadT    -2.6e-4;                    // [Y22] ([S25]: -2.44e-4)

thermoPath                              // solidus/liquidus [Y22], [G18], [S25]
(
    (1878 1)
    (1928 0)
);

// ************************************************************************* //
